<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Vault - Professional Light Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card-front: #ffffff;
      --bg-card-back: #f8fafc;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --easy: #059669;
      --easy-bg: #d1fae5;
      --medium: #d97706;
      --medium-bg: #fef3c7;
      --hard: #dc2626;
      --hard-bg: #fee2e2;
      --border-color: #e2e8f0;
      --border-focus: #3b82f6;
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      overflow-x: hidden;
    }

    /* Container */
    .app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .counter-badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg-surface);
      color: var(--text-secondary);
      padding: 0.35rem 0.75rem;
      border-radius: 99px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    /* Active Flashcard */
    .card-deck {
      perspective: 1200px;
      width: 100%;
      aspect-ratio: 16 / 10;
      min-height: 240px;
      cursor: pointer;
    }

    .flashcard {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      transform-style: preserve-3d;
    }

    .card-deck.flipped .flashcard {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }

    .card-front {
      background: var(--bg-card-front);
    }

    .card-back {
      background: var(--bg-card-back);
      transform: rotateY(180deg);
    }

    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .card-label-type {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .card-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
    }

    .badge-easy { background: var(--easy-bg); color: var(--easy); }
    .badge-medium { background: var(--medium-bg); color: var(--medium); }
    .badge-hard { background: var(--hard-bg); color: var(--hard); }
    .badge-new { background: #f1f5f9; color: var(--text-muted); }

    /* Content & Scrollbar within Flashcard */
    .card-content-area {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      color: var(--text-main);
      margin: auto 0;
      padding: 0.5rem 0;
      overflow-y: auto;
      max-height: 140px;
      word-break: break-word;
    }

    .card-footer-hint {
      text-align: center;
      font-size: 0.725rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Action buttons & navigation */
    .action-panel {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .difficulty-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .nav-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-surface);
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    /* Core Buttons */
    button {
      font-family: var(--font-family);
      font-weight: 600;
      font-size: 0.825rem;
      border: none;
      border-radius: var(--radius-md);
      padding: 0.7rem 1rem;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-easy { background: var(--easy-bg); color: var(--easy); }
    .btn-medium { background: var(--medium-bg); color: var(--medium); }
    .btn-hard { background: var(--hard-bg); color: var(--hard); }
    .btn-easy:hover, .btn-medium:hover, .btn-hard:hover { filter: brightness(0.97); }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-nav-arrow {
      background: transparent;
      color: var(--text-secondary);
      padding: 0.4rem 0.8rem;
    }
    .btn-nav-arrow:hover {
      color: var(--primary-hover);
    }

    /* Management Control Dashboard */
    .dashboard-panel {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dashboard-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .filter-search-row {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-input-wrapper input {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-md);
      outline: none;
      font-size: 0.85rem;
      transition: all 0.15s ease-in-out;
    }

    .search-input-wrapper input:focus {
      border-color: var(--border-focus);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .filter-pills {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 99px;
      background: #f1f5f9;
      border: 1px solid transparent;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-pill.active {
      background: var(--text-main);
      color: #ffffff;
    }

    /* Scrollable Vault Data Grid */
    .vault-scroll-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .vault-card-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.7rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .item-texts {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .item-q {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-a {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .item-tag {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      margin-right: 0.4rem;
      display: inline-block;
    }

    .item-action-btns {
      display: flex;
      gap: 0.25rem;
    }

    .btn-action-small {
      padding: 0.4rem;
      border-radius: 6px;
      background: #f1f5f9;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .btn-action-small:hover {
      background: #e2e8f0;
    }

    /* Modal Styling (Light edition) */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group textarea {
      font-family: var(--font-family);
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.7rem;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.15s;
    }

    .form-group textarea:focus {
      border-color: var(--border-focus);
      background-color: #ffffff;
    }

    /* Empty state */
    .empty-placeholder {
      text-align: center;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-color);
    }

    /* Mobile Adaptability setup */
    @media (max-width: 480px) {
      body {
        padding: 0.75rem 0.5rem;
      }

      .card-deck {
        aspect-ratio: 1.3 / 1;
        min-height: 210px;
      }

      .card-content-area {
        font-size: 1rem;
        max-height: 110px;
      }

      button {
        padding: 0.6rem 0.8rem;
        font-size: 0.775rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Header Summary info -->
    <header>
      <h1>Study Vault</h1>
      <div class="counter-badge" id="statsCounter">Cards: 0</div>
    </header>

    <!-- Main Flashcard Workspace -->
    <main>
      <div id="deckContainer">
        <!-- Managed dynamically in JS -->
      </div>
    </main>

    <!-- Evaluation Buttons & Steps navigation -->
    <div class="action-panel" id="studyPanel">
      <div class="difficulty-group">
        <button class="btn-easy" onclick="markCardStatus('Easy', event)">Easy</button>
        <button class="btn-medium" onclick="markCardStatus('Medium', event)">Medium</button>
        <button class="btn-hard" onclick="markCardStatus('Hard', event)">Hard</button>
      </div>

      <div class="nav-group">
        <button class="btn-nav-arrow" onclick="changeCard(-1)">← Prev</button>
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);" id="progressCount">0 / 0</span>
        <button class="btn-nav-arrow" onclick="changeCard(1)">Next →</button>
      </div>
    </div>

    <!-- Management Dashboard Panel -->
    <section class="dashboard-panel">
      <div class="dashboard-header">
        <h3 class="dashboard-title">Library</h3>
        <button class="btn-primary" onclick="openFormModal()" style="padding: 0.45rem 0.85rem; font-size: 0.775rem;">+ Add Card</button>
      </div>

      <div class="filter-search-row">
        <div class="search-input-wrapper">
          <input type="text" id="vaultSearch" placeholder="Search questions or answers..." oninput="filterAndRenderList()">
        </div>
        <div class="filter-pills" id="filterPillsContainer">
          <span class="filter-pill active" onclick="setFilter('All', this)">All</span>
          <span class="filter-pill" onclick="setFilter('Easy', this)">Easy</span>
          <span class="filter-pill" onclick="setFilter('Medium', this)">Medium</span>
          <span class="filter-pill" onclick="setFilter('Hard', this)">Hard</span>
          <span class="filter-pill" onclick="setFilter('New', this)">New</span>
        </div>
      </div>

      <div class="vault-scroll-list" id="vaultCardsList">
        <!-- Injected list elements -->
      </div>
    </section>

  </div>

  <!-- Form Add/Edit Modal (Light) -->
  <div class="modal" id="formModal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-main);" id="formModalTitle">Create Flashcard</h3>
        <button class="btn-secondary" style="padding: 0.25rem 0.5rem; border-radius: 6px;" onclick="closeFormModal()">✕</button>
      </div>

      <input type="hidden" id="cardIdField">

      <div class="form-group">
        <label for="formQuestion">Question</label>
        <textarea id="formQuestion" placeholder="Type your question..."></textarea>
      </div>

      <div class="form-group">
        <label for="formAnswer">Answer</label>
        <textarea id="formAnswer" placeholder="Type the answer..."></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;">
        <button class="btn-secondary" onclick="closeFormModal()">Cancel</button>
        <button class="btn-primary" onclick="commitCard()">Save Card</button>
      </div>
    </div>
  </div>

  <!-- Details Reader View Modal -->
  <div class="modal" id="viewModal">
    <div class="modal-content" style="max-width: 480px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <span class="card-badge badge-new" id="viewModalLevel">Level</span>
        <button class="btn-secondary" style="padding: 0.25rem 0.5rem; border-radius: 6px;" onclick="closeViewModal()">✕</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <h4 style="font-size: 0.725rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.25rem;">Question</h4>
          <p id="viewModalQ" style="background: #f8fafc; padding: 0.75rem; border-radius: 8px; font-size: 0.9rem; border: 1px solid var(--border-color); white-space: pre-wrap; word-break: break-word; max-height: 140px; overflow-y: auto; color: var(--text-main); font-weight: 500;"></p>
        </div>
        <div>
          <h4 style="font-size: 0.725rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.25rem;">Answer</h4>
          <p id="viewModalA" style="background: #f8fafc; padding: 0.75rem; border-radius: 8px; font-size: 0.9rem; border: 1px solid var(--border-color); white-space: pre-wrap; word-break: break-word; max-height: 140px; overflow-y: auto; color: var(--text-secondary);"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State logic
    let database = [];
    let currentCardIndex = 0;
    let cardSideIsFlipped = false;
    let activeFilterTag = 'All';

    // Standard high-quality light samples
    const initialSamples = [
      { id: '101', question: 'What is a closure in JavaScript?', answer: 'A closure is the combination of a function bundled together with references to its surrounding state (the lexical environment).', level: 'Medium' },
      { id: '102', question: 'What is the standard HTTP status code for "Created"?', answer: 'HTTP 201 Created status code indicates that the request has succeeded and has led to the creation of a resource.', level: 'Easy' },
      { id: '103', question: 'Explain CSS Box Model parameters.', answer: 'The box model consists of Margins, Borders, Padding, and the actual Content area which wraps raw HTML elements.', level: 'Easy' }
    ];

    function startApp() {
      const savedData = localStorage.getItem('study_vault_light_db');
      if (savedData) {
        try {
          database = JSON.parse(savedData);
        } catch (e) {
          database = [...initialSamples];
        }
      } else {
        database = [...initialSamples];
        persistDatabase();
      }
      
      refreshDisplay();
    }

    function persistDatabase() {
      localStorage.setItem('study_vault_light_db', JSON.stringify(database));
    }

    function refreshDisplay() {
      renderActiveDeck();
      filterAndRenderList();
      updateOverviews();
    }

    function updateOverviews() {
      document.getElementById('statsCounter').textContent = `Cards: ${database.length}`;
    }

    function toggleActiveCardFlip() {
      const deck = document.getElementById('deckContainer').firstElementChild;
      if (!deck) return;
      cardSideIsFlipped = !cardSideIsFlipped;
      if (cardSideIsFlipped) {
        deck.classList.add('flipped');
      } else {
        deck.classList.remove('flipped');
      }
    }

    function renderActiveDeck() {
      const container = document.getElementById('deckContainer');
      const studyControls = document.getElementById('studyPanel');
      const progressCountText = document.getElementById('progressCount');

      if (database.length === 0) {
        container.innerHTML = `
          <div class="empty-placeholder">
            <div style="font-size: 2rem;">📂</div>
            <h4 style="font-size: 0.9rem; font-weight: 700;">Your Vault is Empty</h4>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Click on "Add Card" to create your first learning card.</p>
          </div>
        `;
        studyControls.style.display = 'none';
        return;
      }

      studyControls.style.display = 'flex';

      if (currentCardIndex >= database.length) {
        currentCardIndex = database.length - 1;
      }
      if (currentCardIndex < 0) {
        currentCardIndex = 0;
      }

      const activeObj = database[currentCardIndex];
      const levelClass = getLevelBadgeClass(activeObj.level);

      container.innerHTML = `
        <div class="card-deck" id="deckInteractive" onclick="toggleActiveCardFlip()">
          <div class="flashcard">
            <!-- Front Face -->
            <div class="card-face card-front">
              <div class="card-header-bar">
                <span class="card-label-type">Question</span>
                <span class="card-badge ${levelClass}">${activeObj.level || 'New'}</span>
              </div>
              <div class="card-content-area">${safeSanitize(activeObj.question)}</div>
              <div class="card-footer-hint">Tap to flip & view answer</div>
            </div>
            
            <!-- Back Face -->
            <div class="card-face card-back">
              <div class="card-header-bar">
                <span class="card-label-type">Answer</span>
                <span class="card-badge" style="background: #e2e8f0; color: var(--text-secondary);">Detail</span>
              </div>
              <div class="card-content-area">${safeSanitize(activeObj.answer)}</div>
              <div class="card-footer-hint">Tap to return to question</div>
            </div>
          </div>
        </div>
      `;

      cardSideIsFlipped = false;
      progressCountText.textContent = `${currentCardIndex + 1} / ${database.length}`;
    }

    function getLevelBadgeClass(level) {
      if (!level) return 'badge-new';
      switch(level.toLowerCase()) {
        case 'easy': return 'badge-easy';
        case 'medium': return 'badge-medium';
        case 'hard': return 'badge-hard';
        default: return 'badge-new';
      }
    }

    function changeCard(offset) {
      if (database.length <= 1) return;
      
      const deck = document.getElementById('deckInteractive');
      if (deck) deck.classList.remove('flipped');
      cardSideIsFlipped = false;

      setTimeout(() => {
        currentCardIndex = (currentCardIndex + offset + database.length) % database.length;
        renderActiveDeck();
      }, 150);
    }

    function markCardStatus(level, event) {
      if (event) event.stopPropagation();
      if (database.length === 0) return;

      database[currentCardIndex].level = level;
      persistDatabase();
      refreshDisplay();
      
      setTimeout(() => {
        changeCard(1);
      }, 120);
    }

    function setFilter(tag, el) {
      document.querySelectorAll('.filter-pill').forEach(pill => pill.classList.remove('active'));
      el.classList.add('active');
      activeFilterTag = tag;
      filterAndRenderList();
    }

    function filterAndRenderList() {
      const searchVal = document.getElementById('vaultSearch').value.toLowerCase();
      const listContainer = document.getElementById('vaultCardsList');
      listContainer.innerHTML = '';

      const filtered = database.filter(card => {
        const matchesSearch = card.question.toLowerCase().includes(searchVal) || card.answer.toLowerCase().includes(searchVal);
        const matchesTag = (activeFilterTag === 'All') || (card.level && card.level.toLowerCase() === activeFilterTag.toLowerCase());
        return matchesSearch && matchesTag;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1.5rem 0;">No cards found.</p>`;
        return;
      }

      filtered.forEach(card => {
        const item = document.createElement('div');
        item.className = 'vault-card-item';
        const tagClass = getLevelBadgeClass(card.level);
        
        item.innerHTML = `
          <div class="item-texts" onclick="openDetailsView('${card.id}')">
            <div style="display: flex; align-items: center; margin-bottom: 2px;">
              <span class="item-tag ${tagClass}">${card.level || 'New'}</span>
              <span class="item-q">${safeSanitize(card.question)}</span>
            </div>
            <div class="item-a">${safeSanitize(card.answer)}</div>
          </div>
          <div class="item-action-btns">
            <button class="btn-action-small" onclick="openEditModal('${card.id}', event)">✏️</button>
            <button class="btn-action-small" style="color: var(--hard);" onclick="deleteCard('${card.id}', event)">🗑️</button>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function openDetailsView(id) {
      const card = database.find(c => c.id === id);
      if (!card) return;

      document.getElementById('viewModalLevel').className = `card-badge ${getLevelBadgeClass(card.level)}`;
      document.getElementById('viewModalLevel').textContent = card.level || 'New';
      document.getElementById('viewModalQ').textContent = card.question;
      document.getElementById('viewModalA').textContent = card.answer;
      document.getElementById('viewModal').classList.add('active');
    }

    function closeViewModal() {
      document.getElementById('viewModal').classList.remove('active');
    }

    function openFormModal() {
      document.getElementById('formModalTitle').textContent = 'Create Flashcard';
      document.getElementById('cardIdField').value = '';
      document.getElementById('formQuestion').value = '';
      document.getElementById('formAnswer').value = '';
      document.getElementById('formModal').classList.add('active');
    }

    function openEditModal(id, event) {
      if (event) event.stopPropagation();
      const card = database.find(c => c.id === id);
      if (!card) return;

      document.getElementById('formModalTitle').textContent = 'Edit Flashcard';
      document.getElementById('cardIdField').value = card.id;
      document.getElementById('formQuestion').value = card.question;
      document.getElementById('formAnswer').value = card.answer;
      document.getElementById('formModal').classList.add('active');
    }

    function closeFormModal() {
      document.getElementById('formModal').classList.remove('active');
    }

    function commitCard() {
      const id = document.getElementById('cardIdField').value;
      const question = document.getElementById('formQuestion').value.trim();
      const answer = document.getElementById('formAnswer').value.trim();

      if (!question || !answer) {
        alert('Please fill out both fields.');
        return;
      }

      if (id) {
        const index = database.findIndex(c => c.id === id);
        if (index > -1) {
          database[index].question = question;
          database[index].answer = answer;
        }
      } else {
        const newCard = {
          id: Date.now().toString(),
          question: question,
          answer: answer,
          level: 'New'
        };
        database.push(newCard);
        currentCardIndex = database.length - 1;
      }

      persistDatabase();
      refreshDisplay();
      closeFormModal();
    }

    function deleteCard(id, event) {
      if (event) event.stopPropagation();
      if (!confirm('Are you sure you want to delete this card?')) return;

      database = database.filter(c => c.id !== id);

      if (currentCardIndex >= database.length && database.length > 0) {
        currentCardIndex = database.length - 1;
      }

      persistDatabase();
      refreshDisplay();
    }

    function safeSanitize(stringVal) {
      return stringVal
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.onload = startApp;
  </script>
</body>
</html>
